<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
<defs>
  <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06060B"/><stop offset="1" stop-color="#0C0E1E"/>
  </linearGradient>
  <radialGradient id="rouge"><stop offset="0" stop-color="#E32344" stop-opacity=".62"/><stop offset="1" stop-color="#E32344" stop-opacity="0"/></radialGradient>
  <radialGradient id="bleu"><stop offset="0" stop-color="#2F5BD3" stop-opacity=".7"/><stop offset="1" stop-color="#2F5BD3" stop-opacity="0"/></radialGradient>
  <linearGradient id="titre" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0" spreadMethod="repeat">
    <stop offset="0" stop-color="#FF8C1A"/><stop offset=".17" stop-color="#F04A7A"/>
    <stop offset=".34" stop-color="#E32344"/><stop offset=".5" stop-color="#36B3FF"/>
    <stop offset=".67" stop-color="#8B7BFF"/><stop offset=".84" stop-color="#FFC21A"/>
    <stop offset="1" stop-color="#FF8C1A"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="900 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <pattern id="grille" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".045"/>
  </pattern>
  <clipPath id="arrondi"><rect width="1200" height="340" rx="26"/></clipPath>
  <filter id="lueur" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<g clip-path="url(#arrondi)">
  <rect width="1200" height="340" fill="url(#fond)"/>
  <rect width="1200" height="340" fill="url(#grille)"/>
  <circle cx="230" cy="110" r="300" fill="url(#rouge)">
    <animate attributeName="cx" values="230;360;230" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="110;210;110" dur="13s" repeatCount="indefinite"/>
  </circle>
  <circle cx="990" cy="240" r="330" fill="url(#bleu)">
    <animate attributeName="cx" values="990;850;990" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="240;150;240" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="693" cy="97" r="3" fill="#F4C542"><animate attributeName="opacity" values=".15;1;.15" dur="3.7s" begin="0.2s" repeatCount="indefinite"/></circle><circle cx="1127" cy="68" r="3" fill="#F4C542"><animate attributeName="opacity" values=".15;1;.15" dur="3.5s" begin="2.7s" repeatCount="indefinite"/></circle><circle cx="469" cy="39" r="2.5" fill="#F4C542"><animate attributeName="opacity" values=".15;1;.15" dur="3.2s" begin="0.2s" repeatCount="indefinite"/></circle><circle cx="215" cy="302" r="3" fill="#F4C542"><animate attributeName="opacity" values=".15;1;.15" dur="2.3s" begin="1.7s" repeatCount="indefinite"/></circle><circle cx="487" cy="318" r="2.5" fill="#F4C542"><animate attributeName="opacity" values=".15;1;.15" dur="3.5s" begin="1.2s" repeatCount="indefinite"/></circle><circle cx="482" cy="43" r="4" fill="#F4C542"><animate attributeName="opacity" values=".15;1;.15" dur="4.2s" begin="0.9s" repeatCount="indefinite"/></circle><circle cx="325" cy="296" r="2.5" fill="#F4C542"><animate attributeName="opacity" values=".15;1;.15" dur="3.5s" begin="1.7s" repeatCount="indefinite"/></circle><circle cx="400" cy="72" r="4" fill="#F4C542"><animate attributeName="opacity" values=".15;1;.15" dur="3.5s" begin="0.6s" repeatCount="indefinite"/></circle><circle cx="229" cy="300" r="4" fill="#F4C542"><animate attributeName="opacity" values=".15;1;.15" dur="2.3s" begin="0.2s" repeatCount="indefinite"/></circle><circle cx="451" cy="274" r="4" fill="#F4C542"><animate attributeName="opacity" values=".15;1;.15" dur="3.4s" begin="2.3s" repeatCount="indefinite"/></circle><circle cx="983" cy="319" r="3" fill="#F4C542"><animate attributeName="opacity" values=".15;1;.15" dur="3.0s" begin="0.7s" repeatCount="indefinite"/></circle><circle cx="398" cy="144" r="2.5" fill="#F4C542"><animate attributeName="opacity" values=".15;1;.15" dur="3.5s" begin="1.6s" repeatCount="indefinite"/></circle><circle cx="733" cy="249" r="3" fill="#F4C542"><animate attributeName="opacity" values=".15;1;.15" dur="3.6s" begin="0.2s" repeatCount="indefinite"/></circle><circle cx="1078" cy="234" r="2.5" fill="#F4C542"><animate attributeName="opacity" values=".15;1;.15" dur="3.9s" begin="0.5s" repeatCount="indefinite"/></circle><circle cx="1031" cy="235" r="2.5" fill="#F4C542"><animate attributeName="opacity" values=".15;1;.15" dur="4.4s" begin="0.2s" repeatCount="indefinite"/></circle><circle cx="672" cy="194" r="4" fill="#F4C542"><animate attributeName="opacity" values=".15;1;.15" dur="3.0s" begin="1.5s" repeatCount="indefinite"/></circle>
  <!-- clin d'oeil I Like Baylife : un skill-check qui tourne -->
  <g transform="translate(1088 92)" opacity=".85">
    <circle r="40" fill="none" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="9"/>
    <path d="M -28.3 28.3 A 40 40 0 0 1 -40 0" fill="none" stroke="#5AA6D4" stroke-width="9" stroke-linecap="round"/>
    <rect x="-11" y="-11" width="22" height="22" rx="4" fill="#0E1015"/>
    <text y="6" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#EDEDF2">Z</text>
    <line x1="0" y1="-30" x2="0" y2="-50" stroke="#E32344" stroke-width="4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/>
    </line>
  </g>
  <!-- clin d'oeil Paperasse : une feuille qui se balance -->
  <g transform="translate(112 250)" opacity=".9">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-8;8;-8" dur="4s" repeatCount="indefinite"/>
      <path d="M -26 -34 H 12 L 26 -20 V 34 H -26 Z" fill="#FFFDF5" stroke="#2A2540" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="-9" cy="-2" r="3.6" fill="#2A2540"/><circle cx="9" cy="-2" r="3.6" fill="#2A2540"/>
      <path d="M -8 10 Q 0 17 8 10" fill="none" stroke="#2A2540" stroke-width="3.2" stroke-linecap="round"/>
      <ellipse cx="-15" cy="7" rx="4" ry="2.4" fill="#FF9AB0"/><ellipse cx="15" cy="7" rx="4" ry="2.4" fill="#FF9AB0"/>
    </g>
  </g>
  <text x="600" y="170" text-anchor="middle" font-family="'Segoe UI Black', 'Arial Black', 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="900" font-size="108"
        textLength="700" lengthAdjust="spacingAndGlyphs" fill="url(#titre)" filter="url(#lueur)">vortexturize</text>
  <text x="600" y="226" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="29" font-weight="600" fill="#E4E4EE">je fabrique des apps qui servent vraiment</text>
  <text x="600" y="274" text-anchor="middle" font-family="Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace" font-size="17" letter-spacing="4" fill="#8E8EA6">MOBILE  ·  DESKTOP  ·  LOCAL D'ABORD  ·  OPEN SOURCE</text>
</g>
</svg>
